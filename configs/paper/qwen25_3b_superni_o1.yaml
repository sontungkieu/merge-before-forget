experiment:
  id: qwen25-3b-superni-o1
  evidence_class: partial
  rationale: >-
    Paper model, benchmark, and task order are matched, but the paper omits
    Qwen-specific seeds, checkpoint revision, LoRA alpha/dropout, and complete
    decoding details. The pinned SAPT data also contradicts the paper's claimed
    1,000/100/100 cardinality on five tasks. A single-seed first run is not the
    paper's three-seed protocol.

model:
  id: Qwen/Qwen2.5-3B
  revision: 3aab1f1954e9cc14eb9509a215f9e5ca08227a9b
  dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true

data:
  benchmark: superni
  root: data/SAPT/CL_Benchmark/SuperNI
  repository: https://github.com/circle-hit/SAPT.git
  repository_commit: 52a52b920324c656bdb6dac08e43dc600ba22f21
  task_order:
    - task1572_samsum_summary
    - task363_sst2_polarity_classification
    - task1290_xsum_summarization
    - task181_outcome_extraction
    - task002_quoref_answer_generation
    - task1510_evalution_relation_extraction
    - task639_multi_woz_user_utterance_generation
    - task1729_personachat_generate_next
    - task073_commonsenseqa_answer_generation
    - task1590_diplomacy_text_generation
    - task748_glucose_reverse_cause_event_detection
    - task511_reddit_tifu_long_text_summarization
    - task591_sciq_answer_generation
    - task1687_sentiment140_classification
    - task875_emotion_classification
  classification_tasks:
    - task363_sst2_polarity_classification
    - task1687_sentiment140_classification
    - task875_emotion_classification
  max_train_samples_per_task: 1000
  max_eval_samples_per_task: 100

lora:
  rank: 8
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, v_proj]

training:
  epochs: 5
  learning_rate: 5.0e-5
  weight_decay: 0.0
  train_batch_size: 2
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  max_source_length: 1024
  max_target_length: 50
  scheduler: constant
  warmup_steps: 0
  clip_grad_norm: 1.0
  seeds: [42, 43, 44]

evaluation:
  generation_max_new_tokens: 50
  num_beams: 1
  paper_target:
    metric: AA
    order: O1
    method: SLAO
    value_percent: 37.8
  stochastic_relative_tolerance: 0.05
